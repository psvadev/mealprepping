// ── Google Drive helpers ───────────────────────────────────────────────────
async function generatePKCE() {
  const arr = crypto.getRandomValues(new Uint8Array(48));
  const verifier = btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return { verifier, challenge };
}
// ── Drive sync helpers ─────────────────────────────────────────────────────
// ── Data validation ────────────────────────────────────────────────────────
// Imported files, Drive backups, stored data and AI replies are untrusted: normalise shapes before render
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const toStr = v => (v == null ? '' : String(v));
function clampInt(v, lo, hi) {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null;
}
function normalizeMeal(m) {
  if (!isObj(m) || typeof m.name !== 'string' || !m.name.trim()) return null;
  const out = { ...m };
  for (const k of ['emoji', 'description', 'prepTime', 'protein', 'category']) if (m[k] != null) out[k] = toStr(m[k]);
  if (m.batchScore != null) {
    const s = clampInt(m.batchScore, 1, 5);
    if (s == null) delete out.batchScore; else out.batchScore = s;
  }
  return out;
}
function normalizeShoppingList(sl) {
  if (!isObj(sl) || !Array.isArray(sl.categories)) return null;
  const price = p => (isObj(p) && Number.isFinite(Number(p.low)) && Number.isFinite(Number(p.high))
    ? { low: Number(p.low), high: Number(p.high) } : null);
  const item = i => {
    const out = { ...i, name: toStr(i.name), amount: toStr(i.amount) };
    if (i.items !== undefined) out.items = Array.isArray(i.items)
      ? i.items.filter(isObj).map(s => ({ ...s, name: toStr(s.name), amount: toStr(s.amount) })) : [];
    return out;
  };
  const out = { ...sl, categories: sl.categories.filter(isObj).map(c => {
    const cat = { ...c, name: toStr(c.name), emoji: toStr(c.emoji), items: Array.isArray(c.items) ? c.items.filter(isObj).map(item) : [] };
    if (c.price !== undefined) { const p = price(c.price); if (p) cat.price = p; else delete cat.price; }
    return cat;
  }) };
  if (sl.totalPrice !== undefined) { const p = price(sl.totalPrice); if (p) out.totalPrice = p; else delete out.totalPrice; }
  return out;
}
function normalizeRecipe(r) {
  if (!isObj(r)) return null;
  const strings = a => (Array.isArray(a) ? a.filter(x => typeof x === 'string' || typeof x === 'number').map(String) : []);
  const out = { ...r };
  if (r.components !== undefined) out.components = Array.isArray(r.components)
    ? r.components.filter(isObj).map(c => ({ ...c, name: toStr(c.name), ingredients: strings(c.ingredients) })) : [];
  if (r.ingredients !== undefined) out.ingredients = strings(r.ingredients);
  if (r.steps !== undefined) out.steps = typeof r.steps === 'string' ? [r.steps] : strings(r.steps);
  if (r.tips !== undefined) out.tips = typeof r.tips === 'string' ? [r.tips] : strings(r.tips);
  if (r.nutrition !== undefined) {
    out.nutrition = {};
    if (isObj(r.nutrition)) for (const [k, v] of Object.entries(r.nutrition)) {
      const n = parseFloat(v);
      if (Number.isFinite(n)) out.nutrition[k] = n;
    }
  }
  for (const k of ['activeMins', 'passiveMins', 'freezerLifeDays', 'portionWeightGrams']) {
    if (r[k] === undefined) continue;
    const n = parseFloat(r[k]);
    if (Number.isFinite(n) && n >= 0) out[k] = Math.round(n); else delete out[k];
  }
  if (r.pricePerPortion !== undefined && !(isObj(r.pricePerPortion) && Number.isFinite(Number(r.pricePerPortion.low)))) delete out.pricePerPortion;
  return out;
}
function normalizeFreezerItem(f, i) {
  if (!isObj(f) || typeof f.name !== 'string' || !f.name.trim()) return null;
  const remaining = clampInt(f.remaining, 0, 999) ?? 0;
  return { ...f,
    id: typeof f.id === 'string' && f.id ? f.id : `${Date.now()}-${i}-${f.name}`,
    remaining,
    total: Math.max(clampInt(f.total, 0, 999) ?? remaining, remaining),
    cookedAt: /^\d{4}-\d{2}-\d{2}$/.test(f.cookedAt) ? f.cookedAt : localDateString(),
    freezerLifeDays: f.freezerLifeDays == null ? null : clampInt(f.freezerLifeDays, 1, 3650) };
}
// Returns only the recognised, well-formed slices of an import/backup; unknown or broken slices are dropped
function normalizeData(d) {
  if (!isObj(d)) return null;
  const out = {};
  const put = (k, v) => { if (v !== null && v !== undefined) out[k] = v; };
  if (Array.isArray(d.plan)) put('plan', Array.from({ length: 4 }, (_, w) =>
    Array.from({ length: 7 }, (_, day) => (Array.isArray(d.plan[w]) ? normalizeMeal(d.plan[w][day]) : null))));
  if (d.weeks != null) put('weeks', clampInt(d.weeks, 1, 4));
  if (d.portions != null) put('portions', clampInt(d.portions, 1, 20));
  if (Array.isArray(d.suggestions)) put('suggestions', d.suggestions.map(normalizeMeal).filter(Boolean));
  if (Array.isArray(d.favourites)) put('favourites', d.favourites.map(normalizeMeal).filter(Boolean));
  if (isObj(d.proteinTargets)) put('proteinTargets', d.proteinTargets);
  if (d.maxTime != null) put('maxTime', clampInt(d.maxTime, 15, 120));
  if (typeof d.exclusions === 'string') put('exclusions', d.exclusions);
  if (isObj(d.cuisineTargets)) put('cuisineTargets', d.cuisineTargets);
  if (Array.isArray(d.enabledCuisines)) put('enabledCuisines', d.enabledCuisines.filter(k => typeof k === 'string'));
  if (d.suggestionCount != null) put('suggestionCount', clampInt(d.suggestionCount, 5, 30));
  if (d.units === 'metric' || d.units === 'imperial') put('units', d.units);
  if (isObj(d.shoppingLists)) put('shoppingLists', Object.fromEntries(Object.entries(d.shoppingLists)
    .filter(([k]) => /^[0-3]$/.test(k)).map(([k, v]) => [k, normalizeShoppingList(v)]).filter(([, v]) => v)));
  if (isObj(d.lastShoppingKeys)) put('lastShoppingKeys', d.lastShoppingKeys);
  if (isObj(d.recipeCache)) put('recipeCache', Object.fromEntries(Object.entries(d.recipeCache)
    .map(([k, v]) => [k, normalizeRecipe(v)]).filter(([, v]) => v)));
  if (isObj(d.mealNotes)) put('mealNotes', Object.fromEntries(Object.entries(d.mealNotes).filter(([, v]) => typeof v === 'string')));
  if (Array.isArray(d.mealHistory)) put('mealHistory', d.mealHistory.filter(n => typeof n === 'string').slice(-100));
  if (Array.isArray(d.freezerItems)) put('freezerItems', d.freezerItems.map(normalizeFreezerItem).filter(Boolean));
  if (Array.isArray(d.dislikedMeals)) put('dislikedMeals', d.dislikedMeals.filter(n => typeof n === 'string'));
  return out;
}
// Stored data may predate validation or come from an old import: normalise on load
function lsGetNorm(key, fallback) {
  const v = normalizeData({ [key]: lsGet(key, fallback) })[key];
  return v === undefined ? fallback : v;
}
// Freezer portions per dish planned in one week; stock is handed to earlier weeks first
function freezerCoverage(plan, freezerItems, week, portions) {
  const stock = {};
  for (const f of freezerItems || []) {
    if (!(f?.remaining > 0) || typeof f.name !== 'string') continue;
    const k = f.name.toLowerCase();
    stock[k] = (stock[k] || 0) + f.remaining;
  }
  let cover = {}, counts = {};
  for (let w = 0; w <= week; w++) {
    const c = {};
    for (const m of plan?.[w] || []) if (m && !m.leftover) c[m.name] = (c[m.name] || 0) + 1;
    const weekCover = {};
    for (const [name, n] of Object.entries(c)) {
      const k = name.toLowerCase(), need = n * portions, have = Math.min(stock[k] || 0, need);
      if (have > 0) { stock[k] -= have; weekCover[name] = { have, need }; }
    }
    if (w === week) { cover = weekCover; counts = c; }
  }
  const names = Object.keys(counts);
  return { cover, allFrozen: names.length > 0 && names.every(n => cover[n] && cover[n].have >= cover[n].need) };
}

// ── Dates ──────────────────────────────────────────────────────────────────
// Local calendar date (YYYY-MM-DD); toISOString() gives the UTC date and shifts late-evening entries a day back
function localDateString(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// Whole calendar days from a YYYY-MM-DD date until today, in local time
function daysSince(dateStr, now = new Date()) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(y, m - 1, d)) / 86400000);
}

// ── Kassal ingredient matching ─────────────────────────────────────────────
const KASSAL_SKIP = ["salt","vann","pepper","krydder","olje","smør","hvitløk","sukker","mel","saus","kraft"];
const KASSAL_ADJECTIVES = ["tørket","tørkede","hermetiske","hermetisk","fersk","ferske","ferskpresset","hakket","hakkede",
  "finhakket","finhakkede","malt","revet","skivet","kokt","kokte","rå","frossen","frosne","stor","store","liten","små",
  "rød","røde","gul","gule","grønn","grønne","skrelt","moden","modne"];
// Pantry staples are skipped as whole words or compound endings ("olivenolje", "hvetemel"), not as substrings ("melk")
function kassalSkip(ing) {
  return String(ing).toLowerCase().split(/[^a-zæøå]+/).some(w => w && KASSAL_SKIP.some(s => w === s || w.endsWith(s)));
}
// "3 gulrøtter" → "gulrøtter", "1 stor løk" → "løk": amounts and units are only stripped as whole words
function kassalSearchWord(ing) {
  const stripped = String(ing)
    .replace(/^[\d.,/½¼¾\s-]+(?:(?:g|kg|dl|ml|cl|l|stk|ss|ts|pk|pakke|pakker|boks|bokser|glass|beger|pose|poser|skive|skiver|fedd|cm|neve|klype)(?=\s|$))?\s*/i, "")
    .trim();
  const words = stripped.split(/\s+/).map(w => w.replace(/[^a-zA-Z0-9æøåÆØÅéè]/g, "")).filter(Boolean);
  return words.find(w => w.length >= 3 && !KASSAL_ADJECTIVES.includes(w.toLowerCase())) || null;
}

const DRIVE_KEYS = ['plan','weeks','portions','suggestions','proteinTargets','maxTime','exclusions',
  'cuisineTargets','enabledCuisines','suggestionCount','units','shoppingLists','lastShoppingKeys',
  'recipeCache','favourites','mealNotes','mealHistory','freezerItems','dislikedMeals'];
// Fixed key order so local state and a downloaded backup hash identically
const buildDrivePayload = src => Object.fromEntries(DRIVE_KEYS.map(k => [k, src?.[k] ?? null]));
const isEmptyPayload = p => !(
  (Array.isArray(p.plan) && p.plan.some(w => Array.isArray(w) && w.some(Boolean))) ||
  p.suggestions?.length || p.freezerItems?.length || p.favourites?.length);
function hashString(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + ':' + s.length;
}
// Three-way decision between this device, Drive, and the last version both agreed on (base)
function decideSync(localHash, remoteHash, baseHash, localEmpty) {
  if (localHash === remoteHash) return 'in-sync';
  if (!baseHash) return localEmpty ? 'pull' : 'conflict';
  if (remoteHash === baseHash) return 'push';
  if (localHash === baseHash) return 'pull';
  return 'conflict';
}

async function getValidAccessToken(clientId, clientSecret) {
  const t = lsGet('driveToken', null);
  if (!t) return null;
  if (Date.now() < t.expires_at - 60000) return t.access_token;
  if (!t.refresh_token || !clientId) return null;
  let d;
  try {
    const res = await fetch('https://oauth2.googleapis.com/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'refresh_token', refresh_token:t.refresh_token, client_id:clientId, client_secret:clientSecret||'' })
    });
    d = await res.json();
  } catch {
    return 'NETWORK'; // offline or non-JSON reply: keep the token and retry later
  }
  if (d.access_token) {
    const updated = { ...t, access_token:d.access_token, expires_at: Date.now()+(d.expires_in||3600)*1000 };
    lsSet('driveToken', updated);
    return d.access_token;
  }
  if (d.error === 'invalid_grant' || d.error === 'invalid_client') {
    lsSet('driveToken', null);
    return 'TOKEN_EXPIRED';
  }
  return 'NETWORK'; // 5xx or unexpected reply: keep the token
}

      } else { setError(data.stop_reason === 'max_tokens' ? 'Handlelisten ble for lang og ble avkortet. Prøv igjen.' : `Kunne ikke tolke handleliste. Rå respons: ${text.slice(0,300)}`); setRetryFn(() => () => generateShoppingList(week, true)); }
    } catch (err) { setError(`Nettverksfeil: ${err.message}`); setRetryFn(() => () => generateShoppingList(week, true)); }
    setShoppingLoading(false);
  };

  function toggleCollapsedCategory(week, catName) {
    setCollapsedCategories(prev => {
      const s = new Set(prev[week]);
      s.has(catName) ? s.delete(catName) : s.add(catName);
      return {...prev, [week]: s};
    });
  }

  function toggleCheckedItem(week, catName, itemName) {
    const key = `${catName}|${itemName}`;
    setCheckedItems(prev => {
      const weekMap = { ...(prev[week] || {}) };
      if (weekMap[key]) delete weekMap[key];
      else weekMap[key] = true;
      return { ...prev, [week]: weekMap };
    });
  }

  // ── Export / import ───────────────────────────────────────────────────────
  const exportPlan = () => {
    const data = { weeks, portions, plan, suggestions, proteinTargets, maxTime, exclusions,
      cuisineTargets, enabledCuisines, suggestionCount, units, shoppingLists, lastShoppingKeys,
      favourites, mealNotes, mealHistory, freezerItems, dislikedMeals, exportedAt: new Date().toISOString() };
    const date = localDateString();
    downloadFile(JSON.stringify(data, null, 2), `middagsplan-${date}.json`, 'application/json');
  };

  const importPlan = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let raw;
      try { raw = JSON.parse(ev.target.result); }
      catch { setError("Kunne ikke lese filen. Sjekk at det er en gyldig middagsplan-fil."); return; }
      const data = normalizeData(raw);
      if (!data || !Object.keys(data).length) { setError("Filen inneholder ingen middagsplan-data."); return; }
      setError(null);
      setImportPreview({ data, fileName: file.name, exportedAt: typeof raw.exportedAt === 'string' ? raw.exportedAt : null });
    };
    reader.readAsText(file);
    e.target.value="";
  };

  // Cached recipe amounts are baked in for one portions/units setting
  const applyImported = (data) => {
    const scaleChanged = (data.portions && data.portions !== portions) || (data.units && data.units !== units);
    applyDriveData(data);
    if (scaleChanged && !data.recipeCache) {
      setRecipeCache({});
      setShoppingLists(data.shoppingLists || {});
      setLastShoppingKeys(data.lastShoppingKeys || {});
    }
  };

  const confirmImport = () => {
    const { recipeCache: _omit, ...current } = buildDrivePayload(payloadRef.current);
    lsSet('preImportBackup', { ...current, exportedAt: new Date().toISOString() });
    setHasImportBackup(true);
    applyImported(importPreview.data);
    setImportPreview(null);
  };

  const undoImport = () => {
    const backup = normalizeData(lsGet('preImportBackup', null));
    if (backup) applyImported(backup);
    localStorage.removeItem(PFX + 'preImportBackup');
    setHasImportBackup(false);
  };

  const exportShoppingList = () => {
    const sl = shoppingLists[shoppingWeek];
    if (!sl) return;
    const date = new Date().toLocaleDateString("nb-NO");
    const header = `Handleliste uke ${shoppingWeek+1} — ${portions} porsjoner per rett\nGenerert ${date}\n\n`;
    const lines = sl.categories.map(cat =>
      `${cat.emoji} ${cat.name}${cat.price ? ` (ca. ${cat.price.low}–${cat.price.high} kr)` : ""}\n${cat.items.map(i=>`  - ${i.name}${i.amount ? `: ${i.amount}` : ""}${i.items?.length ? "\n"+i.items.map(s=>`      • ${s.name}${s.amount ? `: ${s.amount}` : ""}`).join("\n") : ""}`).join("\n")}`
    ).join("\n\n");
    const price = sl.totalPrice
      ? `\n\nEstimert totalpris: ca. ${sl.totalPrice.low}–${sl.totalPrice.high} kr`
      : "";
    downloadFile(header+lines+price, `handleliste-uke${shoppingWeek+1}.txt`, 'text/plain;charset=utf-8');
  };

  // ── Google Drive sync ────────────────────────────────────────────────────
  const applyDriveData = (d) => {
    if (!d) return;
    if (d.plan) setPlan(d.plan);
    if (d.weeks) setWeeks(d.weeks);
    if (d.portions) setPortions(d.portions);
    if (d.suggestions) setSuggestions(d.suggestions);
    if (d.proteinTargets) setProteinTargets(d.proteinTargets);
    if (d.maxTime) setMaxTime(d.maxTime);
    if (d.exclusions !== undefined) setExclusions(d.exclusions);
    if (d.cuisineTargets) setCuisineTargets(d.cuisineTargets);
    if (d.enabledCuisines) setEnabledCuisines(d.enabledCuisines);
    if (d.units) setUnits(d.units);
    if (d.shoppingLists) setShoppingLists(d.shoppingLists);
    if (d.lastShoppingKeys) setLastShoppingKeys(d.lastShoppingKeys);
    if (d.recipeCache) setRecipeCache(d.recipeCache);
    if (d.suggestionCount) setSuggestionCount(d.suggestionCount);
    if (d.favourites) setFavourites(d.favourites);
    if (d.mealNotes) setMealNotes(d.mealNotes);
    if (d.mealHistory) setMealHistory(d.mealHistory);
    if (d.freezerItems) setFreezerItems(d.freezerItems);
    if (d.dislikedMeals) setDislikedMeals(d.dislikedMeals);
  };

  // A 401 with a token we believed valid: force a refresh on the next attempt
  const expireAccess = () => {
    const t = lsGet('driveToken', null);
    if (t) lsSet('driveToken', { ...t, expires_at: 0 });
  };

  // Reconciles this tab with the Drive backup. Never overwrites Drive with state that has
  // not been compared against it, and never discards local edits Drive has not seen.
  const doSync = useCallback(async ({ checkRemote = false, retried = false } = {}) => {
    if (tabStaleRef.current || !payloadRef.current) return;
    const token = await getValidAccessToken(googleClientId, googleClientSecret);
    if (token === 'TOKEN_EXPIRED') { setDriveConnected(false); setDriveStatus('expired'); return; }
    if (!token || token === 'NETWORK') { setDriveStatus('error'); return; }
    const auth = { Authorization:`Bearer ${token}` };
    const retry = () => { if (retried) setDriveStatus('error'); else syncDriveRef.current?.({ checkRemote, retried:true }); };

    const local = buildDrivePayload(payloadRef.current);
    const localHash = hashString(JSON.stringify(local));
    const baseHash = lsGet('driveSyncedHash', '');
    if (driveReadyRef.current && !checkRemote && localHash === baseHash) return;
    setDriveStatus('syncing');

    let fileId = lsGet('driveFileId', '');
    if (!fileId) {
      const q = encodeURIComponent("name='reheat-and-eat-backup.json' and trashed=false");
      const s = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&spaces=drive&fields=files(id)`, { headers:auth });
      if (s.status === 401) { expireAccess(); return retry(); }
      if (!s.ok) { setDriveStatus('error'); return; }
      fileId = (await s.json()).files?.[0]?.id || '';
      if (fileId) lsSet('driveFileId', fileId);
    }

    let remoteModified = null;
    if (fileId) {
      const m = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime,trashed`, { headers:auth });
      if (m.status === 401) { expireAccess(); return retry(); }
      if (m.status === 404) { lsSet('driveFileId', ''); return retry(); }
      if (!m.ok) { setDriveStatus('error'); return; }
      const meta = await m.json();
      if (meta.trashed) { lsSet('driveFileId', ''); return retry(); }
      remoteModified = meta.modifiedTime;
    }

    if (fileId && remoteModified !== remoteModifiedRef.current) {
      // Drive changed since this tab last saw it (or this tab has not loaded yet): download and decide
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers:auth });
      if (r.status === 401) { expireAccess(); return retry(); }
      if (!r.ok) { setDriveStatus('error'); return; }
      const remote = await r.json();
      const remoteHash = hashString(JSON.stringify(buildDrivePayload(remote)));
      const action = decideSync(localHash, remoteHash, baseHash, isEmptyPayload(local));
      if (action === 'conflict') {
        driveReadyRef.current = false;
        setDriveConflict({ remote, remoteHash, remoteModified });
        setDriveStatus('conflict');
        return;
      }
      remoteModifiedRef.current = remoteModified;
      if (action !== 'push') {
        if (action === 'pull') applyDriveData(normalizeData(remote));
        lsSet('driveSyncedHash', remoteHash);
        driveReadyRef.current = true;
        lsSet('pendingDriveLoad', false);
        setDriveSyncedAt(new Date().toISOString());
        setDriveStatus('synced');
        return;
      }
    }

    driveReadyRef.current = true;
    lsSet('pendingDriveLoad', false);
    if (fileId && localHash === baseHash) { setDriveStatus('synced'); return; }
    if (!fileId && isEmptyPayload(local)) { setDriveStatus('idle'); return; }

    const body = JSON.stringify({ ...local, savedAt: new Date().toISOString() });
    let res;
    if (fileId) {
      res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,modifiedTime`, {
        method:'PATCH', headers:{ ...auth, 'Content-Type':'application/json' }, body
      });
    } else {
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name:'reheat-and-eat-backup.json', mimeType:'application/json' })], { type:'application/json' }));
      form.append('file', new Blob([body], { type:'application/json' }));
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
        method:'POST', headers:auth, body:form
      });
    }
    if (res.status === 401) { expireAccess(); return retry(); }
    if (res.status === 404) { lsSet('driveFileId', ''); remoteModifiedRef.current = null; return retry(); }
    if (!res.ok) { setDriveStatus('error'); return; }
    const saved = await res.json();
    if (saved.id) lsSet('driveFileId', saved.id);
    remoteModifiedRef.current = saved.modifiedTime || null;
    lsSet('driveSyncedHash', localHash);
    setDriveSyncedAt(new Date().toISOString());
    setDriveStatus('synced');
  }, [googleClientId, googleClientSecret]);

  // All Drive traffic runs one request chain at a time, so saves can't overlap or land out of order
  const syncDrive = useCallback((opts) => {
    syncChainRef.current = syncChainRef.current
      .then(() => doSync(opts))
      .catch(e => { console.error('Drive sync failed:', e); setDriveStatus('error'); });
    return syncChainRef.current;
  }, [doSync]);
  syncDriveRef.current = syncDrive;

  const resolveDriveConflict = (useRemote) => {
    const c = driveConflict;
    if (!c) return;
    if (useRemote) applyDriveData(normalizeData(c.remote));
    lsSet('driveSyncedHash', c.remoteHash);
    remoteModifiedRef.current = c.remoteModified;
    driveReadyRef.current = true;
    lsSet('pendingDriveLoad', false);
    setDriveConflict(null);
    if (useRemote) { setDriveSyncedAt(new Date().toISOString()); setDriveStatus('synced'); }
    else syncDrive();
  };

  const connectGoogleDrive = useCallback(async () => {
    if (!googleClientId || !googleClientSecret) return;
    const { verifier, challenge } = await generatePKCE();
    localStorage.setItem('drive_pkce_verifier', verifier);
    const params = new URLSearchParams({
      client_id: googleClientId,
      redirect_uri: window.location.origin + window.location.pathname,
      response_type: 'code',
      scope: 'https://www.googleapis.com/auth/drive.file',
      code_challenge: challenge,
      code_challenge_method: 'S256',
      access_type: 'offline',
      prompt: 'consent'
    });
    window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
  }, [googleClientId, googleClientSecret]);

  const disconnectGoogleDrive = useCallback(async () => {
    const t = lsGet('driveToken', null);
    if (t) {
      const token = t.access_token || t.refresh_token;
      if (token) {
        try { await fetch(`https://oauth2.googleapis.com/revoke?token=${token}`, { method:'POST' }); } catch {}
      }
    }
    localStorage.removeItem('mp_driveToken');
    localStorage.removeItem('mp_driveFileId');
    lsSet('driveSyncedHash', '');
    driveReadyRef.current = false;
    remoteModifiedRef.current = null;
    setDriveConflict(null);
    setDriveConnected(false);
    setDriveStatus('idle');
    setDriveSyncedAt(null);
  }, []);

  scaleRef.current = { portions, units };

  // Latest Drive payload, readable from async sync code without stale closures
  payloadRef.current = { plan, weeks, portions, suggestions, proteinTargets, maxTime, exclusions,
    cuisineTargets, enabledCuisines, suggestionCount, units, shoppingLists, lastShoppingKeys,
    recipeCache, favourites, mealNotes, mealHistory, freezerItems, dislikedMeals };

  // Reconcile with Drive on startup if already connected
  useEffect(() => {
    if (driveConnected) syncDrive({ checkRemote:true });
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Reconcile after OAuth redirect (pendingDriveLoad flag avoids stale closure)
  useEffect(() => {
    if (driveConnected && lsGet('pendingDriveLoad', false)) syncDrive({ checkRemote:true });
  }, [driveConnected, syncDrive]);

  // Auto-save to Drive 2 s after any key state change, but only once this tab has reconciled
  useEffect(() => {
    if (!driveConnected) return;
    clearTimeout(driveSyncTimer.current);
    driveSyncTimer.current = setTimeout(() => { if (driveReadyRef.current) syncDrive(); }, 2000);
    return () => clearTimeout(driveSyncTimer.current);
  }, [plan, weeks, portions, suggestions, proteinTargets, maxTime, exclusions, cuisineTargets, enabledCuisines, suggestionCount, units, freezerItems, favourites, mealHistory, dislikedMeals, mealNotes, shoppingLists, lastShoppingKeys, recipeCache, driveConnected, syncDrive]);

  // Retry when the network returns, check Drive when the app is shown again, flush when it is hidden
  useEffect(() => {
    if (!driveConnected) return;
    let lastCheck = 0;
    const check = () => {
      if (Date.now() - lastCheck < 30000) return;
      lastCheck = Date.now();
      syncDrive({ checkRemote:true });
    };
    const onVisibility = () => {
      if (document.visibilityState === 'visible') check();
      else if (driveReadyRef.current) { clearTimeout(driveSyncTimer.current); syncDrive(); }
    };
    window.addEventListener('online', check);
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      window.removeEventListener('online', check);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [driveConnected, syncDrive]);

  // Another tab changed saved data: block this tab so it can't overwrite those changes
  useEffect(() => {
    const ignore = ['mp_driveToken', 'mp_driveSyncedAt', 'mp_driveSyncedHash', 'mp_driveFileId', 'mp_pendingDriveLoad'];
    const onStorage = (e) => {
      if (!e.key || !e.key.startsWith(PFX) || ignore.includes(e.key)) return;
      tabStaleRef.current = true;
      setTabStale(true);
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);

  const printPlan = () => {
    const rows = Array.from({length:weeks},(_,w) => {
      const cells = DAYS.map((d,di) => {
        const meal = plan[w][di];
        return `<td>${meal ? esc(meal.emoji)+" "+esc(meal.name) : "<span class='empty'>—</span>"}</td>`;
      }).join("");
      return `<tr><td>Uke ${w+1}</td>${cells}</tr>`;
    }).join("");

    const shoppingHtml = Array.from({length:weeks},(_,w) => {
      const sl = shoppingLists[w];
      if (!sl) return "";
      return `
        <h2 style="margin:32px 0 12px;font-size:16px">🛒 Handleliste uke ${w+1} — ${Number(portions)||0} porsjoner per rett</h2>
        ${sl.totalPrice ? `<p class="price">Estimert totalpris: ca. ${Number(sl.totalPrice.low)||0}–${Number(sl.totalPrice.high)||0} kr</p>` : ""}
        <div style="column-count:3;column-gap:24px">
          ${sl.categories.map(cat=>`<div class="cat-box" style="break-inside:avoid;margin-bottom:20px">
            <div class="cat-title">${esc(cat.emoji)} ${esc(cat.name)}</div>
            <ul>${cat.items.map(i=>`<li>${esc(i.name)}${i.amount ? ` — ${esc(i.amount)}` : ""}${i.items?.length ? `<ul style="margin:2px 0 4px;padding-left:14px">${i.items.map(s=>`<li style="color:#999;font-size:11px">${esc(s.name)}${s.amount ? ` — ${esc(s.amount)}` : ""}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>
          </div>`).join("")}
        </div>`;
    }).join("");

    const html = `<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><title>Middagsplan</title>
      <style>
        body{font-family:sans-serif;padding:24px;max-width:1000px;margin:0 auto;background:#0e0f11;color:#e4ddd0}
        h1,h2{color:#e4ddd0}
        table{border-collapse:collapse;width:100%;table-layout:fixed}
        th,td{border:1px solid #2a2b30;padding:6px 8px;font-size:11px;word-wrap:break-word;overflow-wrap:break-word}
        thead th{background:#18191c;color:#b4b2c2;font-size:10px}
        tbody td{background:#141517;vertical-align:top}
        td:first-child{background:#18191c;color:#747280;font-size:10px;font-weight:600;white-space:nowrap;width:48px}
        .empty{color:#3a3b40}
        .cat-title{font-weight:700;font-size:13px;margin-bottom:6px;color:#e8a838}
        .cat-box{min-width:180px}
        ul{margin:0;padding-left:16px;font-size:12px;color:#b4b2c2}
        .meta{color:#747280;font-size:12px;margin-bottom:20px}
        .price{font-size:12px;color:#747280;margin-bottom:12px}
        .print-btn{padding:8px 20px;cursor:pointer;background:#22232a;border:1px solid #2a2b30;color:#e8a838;border-radius:6px;font-size:13px}
        @media print{body{background:#fff;color:#111}th,td{border-color:#ccc}thead th{background:#f0f0f0;color:#333}tbody td{background:#fff}td:first-child{background:#f8f8f8;color:#555}.print-btn{display:none}}
      </style>
      </head><body>
      <h1 style="font-size:20px;margin-bottom:4px">🧊 Reheat &amp; Eat</h1>
      <p class="meta">Generert ${new Date().toLocaleDateString("nb-NO")} · ${Number(portions)||0} porsjoner per rett</p>
      <table>
        <thead><tr><th style="text-align:left"></th>
          ${DAYS.map(d=>`<th>${d}</th>`).join("")}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${shoppingHtml}
      <p style="margin-top:32px;display:flex;gap:10px"><button onclick="window.print()" class="print-btn">Skriv ut</button><button onclick="window.close()" class="print-btn" style="background:#3a1a1a;color:#e87060;border-color:#e87060">✕ Lukk</button></p>
      <script>document.addEventListener('keydown',e=>{if(e.key==='Escape')window.close();});<\/script>
      </body></html>`;

    const win = window.open('','_blank');
    if (!win) { setError("Popup-blokkering er aktiv. Tillat popup-vinduer for denne siden og prøv igjen."); return; }
    win.document.write(html); win.document.close(); win.focus();
  };

  // ── Notes ─────────────────────────────────────────────────────────────────
  const saveNote = () => {
    if (!planModal) return;
    const name = planModal.meal.name;
    setMealNotes(prev => {
      if ((prev[name] || '') === notesDraft) return prev;
      const next = { ...prev };
      if (notesDraft) next[name] = notesDraft; else delete next[name];
      return next;
    });
  };

  // ── Shared button styles ──────────────────────────────────────────────────
  const btnTab = (active) => ({
    padding:"6px 14px", borderRadius:6,
    border: active ? "2px solid #e8a838" : "1px solid #2a2b30",
    background: active ? "#22232a" : "transparent",
    color: active ? "#e8e0d0" : "#b4b2c2",
    cursor:"pointer", fontSize:12, fontFamily:"sans-serif"
  });

  const btnIcon = () => ({
    padding:"6px 12px", borderRadius:6, border:"1px solid #2a2b30",
    background:"transparent", color:"#b4b2c2", cursor:"pointer", fontSize:12, fontFamily:"sans-serif"
  });

  // ──────────────────────────────────────────────────────────────────────────
  // RENDER
  // ──────────────────────────────────────────────────────────────────────────
  return (
    <div style={ isMobile
      ? { position:"fixed", inset:0, display:"flex", flexDirection:"column", background:"#0e0f11" }
      : { minHeight:"100vh", background:"#0e0f11", paddingBottom:60 }
    }>
      <input ref={importRef} type="file" accept=".json" onChange={importPlan} style={{ display:"none" }} />
      <div style={isMobile ? { flex:1, overflowY:"auto", WebkitOverflowScrolling:"touch" } : {}}>

      {/* ── Header ── */}
      <div style={{ background:"linear-gradient(180deg,#1a1b1e 0%,#0e0f11 100%)",
        borderBottom:"1px solid #2a2b30", padding: isMobile ? "12px 16px 10px" : "20px 20px 14px", position:"sticky", top:0, zIndex:100 }}>
        <div className="grid-container" style={{ maxWidth:1400, margin:"0 auto" }}>

          {/* Title row */}
          <div style={{ display:"flex", alignItems:"baseline", gap:10, marginBottom:2 }}>
            <span style={{ fontSize:22 }}>🧊</span>
            <h1 style={{ fontSize:19, fontWeight:700, letterSpacing:"2px", margin:0, color:"#e8e0d0", textTransform:"uppercase" }}>
              REHEAT <span style={{ color:"#e8a838" }}>&amp;</span> EAT
            </h1>
          </div>
          <p style={{ margin:0, fontSize:11, color:"#a8a6b6", fontFamily:"sans-serif" }}>
            Lag én gang. Spis hele uken.
          </p>

          {/* Week selector — mobile only */}
          {isMobile && weeks > 1 && (
            <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:10 }}>
              <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif", letterSpacing:"0.5px" }}>UKE</span>
              {Array.from({length:weeks},(_,i)=>i).map(w => (
                <button key={w} onClick={()=>{ setMobileWeek(w); setShoppingWeek(w); }} style={{
                  width:30, height:30, borderRadius:5,
                  border: mobileWeek===w ? "2px solid #e8a838" : "1px solid #2a2b30",
                  background: mobileWeek===w ? "#22232a" : "transparent",
                  color: mobileWeek===w ? "#e8e0d0" : "#b4b2c2",

                }}>{w+1}</button>
              ))}
            </div>
          )}

          {/* Controls row */}
          {!isMobile && <div style={{ display:"flex", gap:10, marginTop:12, flexWrap:"wrap", alignItems:"center" }}>

            {/* Uker */}
            <div style={{ display:"flex", alignItems:"center", gap:5 }}>
              <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif", letterSpacing:"0.5px" }}>UKE</span>
              {[1,2,3,4].map(w => (
                <button key={w} onClick={()=>{ setWeeks(w); if(view==="shopping") setShoppingWeek(w-1); }} style={{
                  width:28, height:28, borderRadius:5,

                }}>{w}</button>

                          fontFamily:"sans-serif", fontWeight:600 }}>⏰ {batchShelfLife - ageDays} {(batchShelfLife - ageDays) === 1 ? "dag" : "dager"} igjen</span>}

                                fontFamily:"sans-serif", fontWeight:600 }}>👎 Likt ikke</span>}
                            </div>

                                style={{ width:30, height:30, borderRadius:6, border:`1px solid ${favourites.find(f=>f.name===item.name)?"#4a7a4a":"#2a2b30"}`,

                                  cursor:"pointer", fontSize:15, lineHeight:1 }}>👍</button>
                              <button
                                onClick={()=>{
                                  setDislikedMeals(prev=>prev.includes(item.name)?prev:[...prev,item.name]);
                                  setFavourites(prev=>prev.filter(f=>f.name!==item.name));
                                }}
                                title="Likte ikke — utelat fra fremtidige forslag"

                      </div>
                      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                        {NUTRITION_FIELDS.map(f => ({label:f.label, val:`${recipe.nutrition[f.key]}${f.unit}`, color:f.color})).map(n => (
                          <div key={n.label} style={{ flex:"1 1 90px", display:"flex", flexDirection:"column",
                            alignItems:"center", padding:"10px 8px", background:"#1c1d21", borderRadius:8, gap:4 }}>
                            <span style={{ fontSize:14, fontWeight:700, color:n.color, fontFamily:"sans-serif" }}>{n.val}</span>
                            <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif" }}>{n.label}</span>
                          </div>
                        ))}
                        {recipe.pricePerPortion && (
                          <div style={{ flex:"1 1 90px", display:"flex", flexDirection:"column",
                            alignItems:"center", padding:"10px 8px", background:"#1c1d21", borderRadius:8, gap:4 }}>
                            <span style={{ fontSize:14, fontWeight:700, color:"#a8c4a8", fontFamily:"sans-serif" }}>
                              ca. {recipe.pricePerPortion.low}–{recipe.pricePerPortion.high} kr
                            </span>
                            <span style={{ fontSize:9, color:"#747280", fontFamily:"sans-serif" }}>
                              {recipe.pricePerPortion.source==="kassal" ? "kassal.app" : "AI-estimat"}
                            </span>
                            <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif" }}>Pris/porsjon</span>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                  {recipe.tips?.length > 0 && (
                    <div style={{ paddingTop:12, borderTop:"1px solid #22232a" }}>
                      <div style={{ fontSize:10, color:"#a8a6b6", fontFamily:"sans-serif",
                        letterSpacing:"0.8px", marginBottom:8, fontWeight:600 }}>MEAL PREP-TIPS</div>
                      <ul style={{ margin:0, padding:0, listStyle:"none", display:"flex", flexDirection:"column", gap:6 }}>
                        {recipe.tips.map((tip,i) => (
                          <li key={i} style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
                            <span style={{ fontSize:13, flexShrink:0 }}>💡</span>
                            <span style={{ fontSize:12, color:"#c8c0d0", fontFamily:"sans-serif", lineHeight:1.5 }}>{tip}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── PLAN DETAIL MODAL ── */}
      {planModal && (
        <div onClick={()=>{ saveNote(); setPlanModal(null); }}
          style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.78)", zIndex:200,
            display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#18191c", border:"1px solid #2a2b30",
            borderRadius:14, width:"100%", maxWidth:720, maxHeight:"88vh", overflowY:"auto", padding:24 }}>

            <div style={{ display:"flex", alignItems:"flex-start", gap:12, marginBottom:14 }}>
              <span style={{ fontSize:32 }}>{planModal.meal.emoji}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:18, fontWeight:700, color:"#e4ddd0", marginBottom:4 }}>
                  {planModal.meal.name}
                </div>
                <div style={{ fontSize:12, color:"#a8a6b6", fontFamily:"sans-serif" }}>
                  {DAYS[planModal.day]}, uke {planModal.week+1} · ⏱ {planModal.meal.prepTime} · {portions} porsjoner
                </div>
              </div>
              <button onClick={()=>toggleFavourite(planModal.meal)} style={{ background:"transparent",
                border:"none", cursor:"pointer", fontSize:20, lineHeight:1, padding:4,
                color:isFavourite(planModal.meal)?"#e8a838":"#44424e" }}
                title={isFavourite(planModal.meal)?"Fjern fra favoritter":"Legg til favoritter"}>★</button>
              <button onClick={()=>{ saveNote(); setPlanModal(null); }} style={{ background:"transparent",
                border:"none", color:"#747280", cursor:"pointer", fontSize:20, lineHeight:1, padding:4 }}>✕</button>
            </div>

            <p style={{ margin:"0 0 18px", fontSize:13, color:"#a8a6b6", fontFamily:"sans-serif", lineHeight:1.6 }}>
              {planModal.meal.description}
            </p>

            {planModal.meal.leftover ? (
              <div style={{ padding:"20px 0", fontSize:13, color:"#747280", fontFamily:"sans-serif", fontStyle:"italic" }}>
                Denne dagen er satt av til rester. Ingen oppskrift nødvendig.
              </div>
            ) : recipeLoading===planModal.meal.name ? (
              <div style={{ textAlign:"center", padding:"24px 0", fontSize:13, color:"#747280", fontFamily:"sans-serif" }}>
                Laster oppskrift...
              </div>
            ) : !recipeCache[planModal.meal.name] ? (
              <div style={{ marginBottom:16 }}>
                {recipeError?.name === planModal.meal.name && (
                  <div style={{ fontSize:12, color:"#e87a38", fontFamily:"sans-serif", marginBottom:8 }}>⚠ {recipeError.message}</div>
                )}
                <button onClick={()=>fetchRecipe(planModal.meal)} style={{ padding:"7px 16px", borderRadius:7,
                  border:"1px solid #2a2b30", background:"transparent", color:"#b4b2c2",
                  cursor:"pointer", fontSize:12, fontFamily:"sans-serif" }}>
                  {recipeError?.name === planModal.meal.name ? "Prøv igjen" : "Last inn oppskrift"}
                </button>
              </div>
            ) : null}
            {!planModal.meal.leftover && recipeCache[planModal.meal.name] && (() => {
              const recipe = recipeCache[planModal.meal.name];
              return (
                <div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:18 }}>
                    <div>
                      <div style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif",
                        letterSpacing:"0.8px", marginBottom:10, fontWeight:600 }}>INGREDIENSER</div>
                      {recipe.components ? recipe.components.map((comp,ci) => (
                        <div key={ci} style={{ marginBottom: ci < recipe.components.length-1 ? 12 : 0 }}>
                          {recipe.components.length > 1 && (
                            <div style={{ fontSize:10, color:"#e8a838", fontFamily:"sans-serif",
                              fontWeight:600, marginBottom:4, letterSpacing:"0.5px" }}>{comp.name}</div>
                          )}
                          <ul style={{ margin:0, padding:0, listStyle:"none" }}>
                            {comp.ingredients?.map((ing,j) => (
                              <li key={j} style={{ fontSize:13, color:"#d4cdc4", fontFamily:"sans-serif",
                                padding:"5px 0", borderBottom:"1px solid #22232a", display:"flex", gap:8 }}>
                                <span style={{ color:"#e8a838", marginTop:2 }}>•</span>{ing}
                              </li>
                            ))}
                          </ul>
                        </div>
                      )) : (
                        <ul style={{ margin:0, padding:0, listStyle:"none" }}>
                          {recipe.ingredients?.map((ing,j) => (
                            <li key={j} style={{ fontSize:13, color:"#d4cdc4", fontFamily:"sans-serif",
                              padding:"5px 0", borderBottom:"1px solid #22232a", display:"flex", gap:8 }}>
                              <span style={{ color:"#e8a838", marginTop:2 }}>•</span>{ing}
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                    <div>
                      <div style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif",
                        letterSpacing:"0.8px", marginBottom:10, fontWeight:600 }}>FREMGANGSMÅTE</div>
                      <ol style={{ margin:0, padding:0, listStyle:"none" }}>
                        {recipe.steps?.map((step,j) => (
                          <li key={j} style={{ fontSize:13, color:"#d4cdc4", fontFamily:"sans-serif",
                            padding:"5px 0", borderBottom:"1px solid #22232a", display:"flex", gap:10 }}>
                            <span style={{ color:"#e8a838", fontWeight:700, minWidth:18, flexShrink:0 }}>{j+1}.</span>{step}
                          </li>
                        ))}
                      </ol>
                    </div>
                  </div>
                  {recipe.nutrition && (
                    <div style={{ borderTop:"1px solid #22232a", paddingTop:14, marginBottom:14 }}>
                      <div style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif",
                        letterSpacing:"0.8px", marginBottom:10, fontWeight:600 }}>
                        NÆRING PER PORSJON{recipe.portionWeightGrams ? <span style={{ fontWeight:400, color:"#747280", marginLeft:6 }}>· ca. {recipe.portionWeightGrams} g</span> : null}
                      </div>
                      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                        {NUTRITION_FIELDS.map(f => ({label:f.label, val:`${recipe.nutrition[f.key]}${f.unit}`, color:f.color})).map(n => (
                          <div key={n.label} style={{ flex:"1 1 90px", display:"flex", flexDirection:"column",
                            alignItems:"center", padding:"10px 8px", background:"#1c1d21", borderRadius:8, gap:4 }}>
                            <span style={{ fontSize:14, fontWeight:700, color:n.color, fontFamily:"sans-serif" }}>{n.val}</span>
                            <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif" }}>{n.label}</span>
                          </div>
                        ))}
                        {recipe.pricePerPortion && (
                          <div style={{ flex:"1 1 90px", display:"flex", flexDirection:"column",
                            alignItems:"center", padding:"10px 8px", background:"#1c1d21", borderRadius:8, gap:4 }}>
                            <span style={{ fontSize:14, fontWeight:700, color:"#a8c4a8", fontFamily:"sans-serif" }}>
                              ca. {recipe.pricePerPortion.low}–{recipe.pricePerPortion.high} kr
                            </span>
                            <span style={{ fontSize:9, color:"#747280", fontFamily:"sans-serif" }}>
                              {recipe.pricePerPortion.source==="kassal" ? "kassal.app" : "AI-estimat"}
                            </span>
                            <span style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif" }}>Pris/porsjon</span>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {(() => {
              const recipe = recipeCache[planModal?.meal?.name];
              if (!recipe?.tips?.length) return null;
              return (
                <div style={{ borderTop:"1px solid #22232a", paddingTop:14, marginBottom:16 }}>
                  <div style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif",
                    letterSpacing:"0.8px", marginBottom:10, fontWeight:600 }}>MEAL PREP-TIPS</div>
                  <ul style={{ margin:0, padding:0, listStyle:"none", display:"flex", flexDirection:"column", gap:7 }}>
                    {recipe.tips.map((tip, i) => (
                      <li key={i} style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
                        <span style={{ fontSize:14, flexShrink:0 }}>💡</span>
                        <span style={{ fontSize:13, color:"#c8c0d0", fontFamily:"sans-serif", lineHeight:1.5 }}>{tip}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              );
            })()}

            <div style={{ borderTop:"1px solid #22232a", paddingTop:14, marginBottom:16 }}>
              <div style={{ fontSize:10, color:"#747280", fontFamily:"sans-serif",
                letterSpacing:"0.8px", marginBottom:8, fontWeight:600 }}>NOTATER</div>
              <textarea
                value={notesDraft}
                onChange={e=>setNotesDraft(e.target.value)}
                placeholder="f.eks. dobbel porsjon, uten chili, bytt ut kylling med tofu..."
                rows={2}
                style={{ width:"100%", background:"#141517", border:"1px solid #2a2b30",
                  borderRadius:6, padding:"8px 10px", color:"#e4ddd0", fontFamily:"sans-serif",
                  fontSize:12, resize:"vertical", lineHeight:1.5 }}
              />
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <button onClick={()=>{ saveNote(); setPlanModal(null); }} style={{ padding:"8px 18px",
                borderRadius:8, border:"1px solid #2a2b30", background:"transparent", color:"#b4b2c2",
                cursor:"pointer", fontSize:13, fontFamily:"sans-serif" }}>Lukk</button>
              <button onClick={()=>{ saveNote(); removeCell(planModal.week,planModal.day); setPlanModal(null); }}
                style={{ padding:"8px 20px", borderRadius:8, border:"1px solid #5a2a2a",
                  background:"#2a1818", color:"#d4a0a0", cursor:"pointer", fontSize:13,
                  fontFamily:"sans-serif", fontWeight:600 }}>🗑 Fjern fra plan</button>
            </div>
          </div>
        </div>
      )}

      </div>{/* end scroll container */}

      {/* ── Mobile bottom nav ── */}
      {isMobile && (
        <div style={{ flexShrink:0, background:"#18191c", borderTop:"1px solid #2a2b30", display:"flex", height:56 }}>
          {[
            { label:"Plan",         emoji:"📅", action:()=>{ setPlanModal(null); setSuggestionModal(null); setView("plan"); },                          key:"plan" },
            { label:"Handleliste",  emoji:"🛒", action:()=>{ setPlanModal(null); setSuggestionModal(null); generateShoppingList(shoppingWeek); },       key:"shopping" },
            { label:"Fryser",       emoji:"❄️", action:()=>{ setPlanModal(null); setSuggestionModal(null); setView("fryser"); },                        key:"fryser" },
            { label:"Innstillinger",emoji:"⚙",  action:()=>{ setPlanModal(null); setSuggestionModal(null); setView("settings"); },                     key:"settings" },
          ].map(tab => (
            <button key={tab.key} onClick={tab.action} style={{
              flex:1, display:"flex", flexDirection:"column", alignItems:"center",
              justifyContent:"center", gap:2, background:"transparent", border:"none",
              color: view===tab.key ? "#e8a838" : "#747280", cursor:"pointer",
              borderTop: view===tab.key ? "2px solid #e8a838" : "2px solid transparent",
              fontSize:10, fontFamily:"sans-serif"
            }}>
              <span style={{ fontSize:18, position:"relative", display:"inline-block" }}>
                {tab.emoji}
                {tab.key==='settings' && showDriveBadge && (
                  <span style={{ position:"absolute", top:-1, right:-3, width:7, height:7, borderRadius:99, background:"#e8a838", border:"1px solid #0e0f11" }} />
                )}
              </span>
              {tab.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Last line of defence: a render crash shows a recovery screen instead of a blank page
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Reheat & Eat crashed:', error, info && info.componentStack); }
  render() {
    if (!this.state.error) return this.props.children;
    const exportData = () => {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k.startsWith(PFX) || /(Key|Token|Secret|ClientId)$/.test(k)) continue;
        try { data[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k)); } catch {}
      }
      downloadFile(JSON.stringify(data, null, 2), `middagsplan-nodeksport-${localDateString()}.json`, 'application/json');
    };
    const btn = { padding:"8px 16px", borderRadius:8, border:"1px solid #2a2b30", background:"transparent",
      color:"#b4b2c2", cursor:"pointer", fontSize:13, fontFamily:"sans-serif" };
    return (
      <div style={{ minHeight:"100vh", background:"#0e0f11", color:"#e4ddd0", display:"flex",
        alignItems:"center", justifyContent:"center", padding:16, fontFamily:"Georgia, 'Times New Roman', serif" }}>
        <div role="alert" style={{ maxWidth:460, width:"100%", background:"#18191c", border:"1px solid #3a2a2a", borderRadius:14, padding:24 }}>
          <h2 style={{ margin:"0 0 8px", fontSize:18, color:"#e8a838" }}>Noe gikk galt</h2>
          <p style={{ margin:"0 0 12px", fontSize:13, color:"#b4b2c2", fontFamily:"sans-serif", lineHeight:1.6 }}>
            Siden kunne ikke vises, trolig på grunn av uventede data. Ingenting er slettet. Gå til planen, eller last ned en kopi av dataene først.
          </p>
          <pre style={{ margin:"0 0 16px", fontSize:11, color:"#747280", whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </pre>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            <button onClick={() => { window.location.hash = 'plan'; window.location.reload(); }}
              style={{ ...btn, border:"none", background:"#e8a838", color:"#0e0f11", fontWeight:700 }}>Gå til planen</button>
            <button onClick={exportData} style={btn}>Last ned data (.json)</button>
            <button onClick={() => this.setState({ error: null })} style={btn}>Prøv igjen</button>
          </div>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
